<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E&amp;PDE 2027 · A / B</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111827;
      --ink-body: #1f2937;
      --muted: #71717a;
      --line: #e4e4e7;
      --surface: #fafafa;

      --c-bg: #eef2ff;
      --t-bg: #3730a3;
      --c-problem: #fef2f2;
      --t-problem: #991b1b;
      --c-objective: #ecfdf5;
      --t-objective: #065f46;
      --c-method: #eff6ff;
      --t-method: #1e40af;
      --c-findings: #fffbeb;
      --t-findings: #92400e;
      --c-expected: #f5f3ff;
      --t-expected: #5b21b6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 36px 28px 64px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--ink);
    }

    .brand-meta {
      font-size: 13px;
      color: var(--muted);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      height: 34px;
      padding: 0 14px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .btn:hover {
      border-color: #a1a1aa;
    }

    .btn:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .btn[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: #ffffff;
    }

    .segmented {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg);
    }

    .segmented button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      height: 32px;
      padding: 0 12px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .segmented button + button {
      border-left: 1px solid var(--line);
    }

    .segmented button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: -2px;
    }

    .segmented button[aria-pressed="true"] {
      background: var(--ink);
      color: #ffffff;
    }

    .legend {
      display: none;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 14px 0 6px;
    }

    .legend.visible {
      display: flex;
    }

    .legend-chip {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 4px 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s ease, border-color 0.15s ease;
    }

    .legend-chip[aria-pressed="true"] {
      border-color: currentColor;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 44px;
      margin-top: 28px;
    }

    @media (max-width: 880px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 36px;
      }
    }

    .column {
      min-width: 0;
    }

    @media (min-width: 881px) {
      .column + .column {
        border-left: 1px solid var(--line);
        padding-left: 44px;
      }
    }

    .col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 26px;
      padding: 0 8px;
      border-radius: 4px;
      background: var(--ink);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
    }

    .word-count {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .doc-title {
      margin: 0 0 18px 0;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.5;
      color: var(--ink);
    }

    .doc-body p {
      margin: 0 0 14px 0;
      font-size: 15px;
      line-height: 1.85;
      color: var(--ink-body);
    }

    .doc-body p:last-child {
      margin-bottom: 0;
    }

    .seg {
      border-radius: 3px;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }

    .seg-tag {
      display: none;
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 3px;
      margin-right: 5px;
      vertical-align: 1px;
      letter-spacing: 0.01em;
    }

    body.annotated .seg {
      padding: 1px 3px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    body.annotated .seg-tag {
      display: inline-block;
    }

    body.annotated .seg[data-role="bg"] { background: var(--c-bg); }
    body.annotated .seg[data-role="bg"] .seg-tag,
    .legend-chip[data-role="bg"] { background: var(--c-bg); color: var(--t-bg); }

    body.annotated .seg[data-role="problem"] { background: var(--c-problem); }
    body.annotated .seg[data-role="problem"] .seg-tag,
    .legend-chip[data-role="problem"] { background: var(--c-problem); color: var(--t-problem); }

    body.annotated .seg[data-role="objective"] { background: var(--c-objective); }
    body.annotated .seg[data-role="objective"] .seg-tag,
    .legend-chip[data-role="objective"] { background: var(--c-objective); color: var(--t-objective); }

    body.annotated .seg[data-role="method"] { background: var(--c-method); }
    body.annotated .seg[data-role="method"] .seg-tag,
    .legend-chip[data-role="method"] { background: var(--c-method); color: var(--t-method); }

    body.annotated .seg[data-role="findings"] { background: var(--c-findings); }
    body.annotated .seg[data-role="findings"] .seg-tag,
    .legend-chip[data-role="findings"] { background: var(--c-findings); color: var(--t-findings); }

    body.annotated .seg[data-role="expected"] { background: var(--c-expected); }
    body.annotated .seg[data-role="expected"] .seg-tag,
    .legend-chip[data-role="expected"] { background: var(--c-expected); color: var(--t-expected); }

    body.annotated[data-focus] .seg {
      opacity: 0.25;
      background: transparent;
    }

    body.annotated[data-focus="bg"] .seg[data-role="bg"],
    body.annotated[data-focus="problem"] .seg[data-role="problem"],
    body.annotated[data-focus="objective"] .seg[data-role="objective"],
    body.annotated[data-focus="method"] .seg[data-role="method"],
    body.annotated[data-focus="findings"] .seg[data-role="findings"],
    body.annotated[data-focus="expected"] .seg[data-role="expected"] {
      opacity: 1;
    }

    body.annotated[data-focus="bg"] .seg[data-role="bg"] { background: var(--c-bg); }
    body.annotated[data-focus="problem"] .seg[data-role="problem"] { background: var(--c-problem); }
    body.annotated[data-focus="objective"] .seg[data-role="objective"] { background: var(--c-objective); }
    body.annotated[data-focus="method"] .seg[data-role="method"] { background: var(--c-method); }
    body.annotated[data-focus="findings"] .seg[data-role="findings"] { background: var(--c-findings); }
    body.annotated[data-focus="expected"] .seg[data-role="expected"] { background: var(--c-expected); }

    .sub-block {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      transition: opacity 0.15s ease;
    }

    .sub-label {
      margin: 0 0 8px 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
    }

    .sub-text {
      margin: 0;
      font-size: 14px;
      line-height: 1.8;
      color: var(--ink-body);
    }

    .kw-block {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      transition: opacity 0.15s ease;
    }

    .kw-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .kw-item {
      font-size: 12px;
      line-height: 1.4;
      color: var(--ink-body);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 3px 9px;
    }

    body.annotated[data-focus] .sub-block,
    body.annotated[data-focus] .kw-block {
      opacity: 0.35;
    }

    @media print {
      .controls {
        display: none;
      }
      .container {
        padding: 0;
      }
    }
  </style>
</head>

      </div>
    </header>

    <div class="legend" id="legend" aria-label="结构标注图例"></div>

    <div class="grid" id="grid"></div>
  </main>

              ]
            ],
            outcomes: "Addressing the dual challenge that subjective workshop impressions are hard to verify objectively while wearable eye-trackers remain costly and intrusive in real exhibition spaces, this paper advances a multi-modal quantitative evaluation toolkit for interpretive signage. Its appeal lies in starting from a low-barrier, non-contact webcam method that maps gaze onto printed signs without wearable hardware, and extending it toward accuracy benchmarking, multi-sign route tracking, cognitive load scales, and delayed retention tests—enabling visual attention, mental workload, and lasting recall to be evaluated together. This work will be useful for evaluation teams and practitioners in botanical gardens, museums, and cultural venues seeking accessible field methods, as well as researchers and design educators teaching evidence-based design evaluation.",
            keywords: ["Co-creation", "Interpretive Signage", "Multi-Modal Evaluation", "Gaze Tracking", "Memory Assessment"]
          }
        ]
      }
    };

    let state = {
      lang: "zh",
      annotated: true,
      focusRole: null
    };

    const roleMap = Object.fromEntries(ROLES.map(r => [r.key, r]));
    const pageHeadingEl = document.getElementById("page-heading");
    const toggleBtn = document.getElementById("toggle-annotations");
    const langZhBtn = document.getElementById("lang-zh");
    const langEnBtn = document.getElementById("lang-en");
    const legendEl = document.getElementById("legend");
    const gridEl = document.getElementById("grid");

    function countLength(draft, lang) {
      const body = draft.paragraphs.map(p => p.map(s => s.text).join(" ")).join(" ");
      if (lang === "en") {
        return body.trim().split(/\s+/).length;
      }
      return body.replace(/\s+/g, "").length;
    }

    function renderLegend() {
      legendEl.innerHTML = "";
      legendEl.classList.toggle("visible", state.annotated);
      for (const role of ROLES) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "legend-chip";
        chip.dataset.role = role.key;
        chip.textContent = role[state.lang];
        chip.setAttribute("aria-pressed", String(state.focusRole === role.key));
        chip.addEventListener("click", () => {
          state.focusRole = state.focusRole === role.key ? null : role.key;
          syncFocus();
          renderLegend();
        });
        legendEl.appendChild(chip);
      }
    }

    function syncFocus() {
      if (state.annotated && state.focusRole) {
        document.body.dataset.focus = state.focusRole;
      } else {
        delete document.body.dataset.focus;
      }
    }

    function render() {
      const bundle = DATA[state.lang];
      document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
      pageHeadingEl.textContent = bundle.heading;
      toggleBtn.textContent = bundle.toggleLabel;
      toggleBtn.setAttribute("aria-label", bundle.toggleAria);
      toggleBtn.setAttribute("aria-pressed", String(state.annotated));
      langZhBtn.setAttribute("aria-pressed", String(state.lang === "zh"));
      langEnBtn.setAttribute("aria-pressed", String(state.lang === "en"));
      document.body.classList.toggle("annotated", state.annotated);
      syncFocus();
      renderLegend();

      gridEl.innerHTML = "";
      for (const draft of bundle.drafts) {
        const section = document.createElement("section");
        section.className = "column";

        const header = document.createElement("div");
        header.className = "col-header";

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = draft.id;

        const wc = document.createElement("span");
        wc.className = "word-count";
        wc.textContent = `${countLength(draft, state.lang)} ${bundle.countUnit}`;

        header.append(badge, wc);

        const title = document.createElement("h2");
        title.className = "doc-title";
        title.textContent = draft.title;

        const body = document.createElement("div");
        body.className = "doc-body";

        for (const para of draft.paragraphs) {
          const p = document.createElement("p");
          para.forEach((seg, idx) => {
            if (idx > 0 && state.lang === "en") {
              p.appendChild(document.createTextNode(" "));
            }
            const span = document.createElement("span");
            span.className = "seg";
            span.dataset.role = seg.role;

            const tag = document.createElement("span");
            tag.className = "seg-tag";
            tag.textContent = roleMap[seg.role][state.lang];

            span.append(tag, document.createTextNode(seg.text));
            p.appendChild(span);
          });
          body.appendChild(p);
        }

        const outcomesSection = document.createElement("div");
        outcomesSection.className = "sub-block";

        const outcomesLabel = document.createElement("h3");
        outcomesLabel.className = "sub-label";
        outcomesLabel.textContent = bundle.outcomesLabel;

        const outcomesText = document.createElement("p");
        outcomesText.className = "sub-text";
        outcomesText.textContent = draft.outcomes;

        outcomesSection.append(outcomesLabel, outcomesText);

        const kwSection = document.createElement("div");
        kwSection.className = "kw-block";

        const kwLabel = document.createElement("h3");
        kwLabel.className = "sub-label";
        kwLabel.textContent = bundle.keywordsLabel;

        const kwList = document.createElement("ul");
        kwList.className = "kw-list";
        for (const kw of draft.keywords) {
          const li = document.createElement("li");
          li.className = "kw-item";
          li.textContent = kw;
          kwList.appendChild(li);
        }

        kwSection.append(kwLabel, kwList);

        section.append(header, title, body, outcomesSection, kwSection);
        gridEl.appendChild(section);
      }
    }

    toggleBtn.addEventListener("click", () => {
      state.annotated = !state.annotated;
      if (!state.annotated) state.focusRole = null;
      render();
    });

    langZhBtn.addEventListener("click", () => {
      if (state.lang !== "zh") {
        state.lang = "zh";
        render();
      }
    });

    langEnBtn.addEventListener("click", () => {
      if (state.lang !== "en") {
        state.lang = "en";
        render();
      }
    });

    const params = new URLSearchParams(window.location.search);
    if (params.get("lang") === "en") state.lang = "en";
    const annotatedParam = params.get("annotated");
    if (annotatedParam === "0" || annotatedParam === "false") state.annotated = false;
    else if (annotatedParam === "1" || annotatedParam === "true") state.annotated = true;
    const focusParam = params.get("focus");
    if (focusParam && Object.prototype.hasOwnProperty.call(roleMap, focusParam)) {
      state.annotated = true;
      state.focusRole = focusParam;
    }

    render();
  </script>
</body>
</html>
